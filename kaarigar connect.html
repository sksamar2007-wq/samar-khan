function persistLocal(){try{localStorage.setItem('artisanconnect_demo_db',JSON.stringify(db));}catch(e){}}

async function api(path,options={}){try{const r=await fetch(API_BASE+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(!r.ok)throw new Error('API '+r.status);return await r.json()}catch(e){return null}}
async function checkBackend(){const r=await api('/health');state.backend=r?'connected':'demo';updateBackendLabel()}
function updateBackendLabel(){const el=$('#roleLabel');if(el)el.textContent=(state.role==='admin'?'Admin demo':state.role==='buyer'?'Buyer workspace':'Artisan workspace')+(state.backend==='connected'?' · DB connected':' · Demo mode')}
function toast(msg){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2800)}
function setPage(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function navItem(icon,label,page){return `<button class="navbtn ${state.page===page?'active':''}" onclick="setPage('${page}')"><span>${icon}</span><span>${label}</span></button>`}
function shell(content){const nav=state.role==='buyer'?[['⌂','Discover','market'],['♡','Saved','saved'],['🛒','Cart','cart'],['▤','My Orders','buyerOrders'],['♙','Profile','buyerProfile']]:state.role==='admin'?[['▦','Overview','admin'],['♙','Artisans','adminArtisans'],['◇','Products','catalog'],['▤','Orders','orders']]:[['⌂','Overview','dashboard'],['＋','Add with AI','add'],['▧','My Catalog','catalog'],['▤','Orders','orders'],['₹','Earnings','earnings'],['♙','My Profile','profile'],['◎','Bulk Orders','bulk']];
return `<div class="layout"><aside class="sidebar"><div class="side-label">WORKSPACE</div>${nav.map(n=>navItem(...n)).join('')}<div class="side-label">DISCOVER</div>${navItem('⌕','Marketplace','market')}${navItem('✦','AI Assistant','assistant')}<div class="side-profile"><img class="avatar" src="${esc(db.artisan.photo)}"><div><b style="font-size:12px">${esc(db.artisan.name)}</b><div class="tiny muted">${esc(db.artisan.craft)} artisan</div></div></div></aside><main class="content">${content}</main></div><nav class="bottomnav">${nav.slice(0,5).map(n=>`<button class="${state.page===n[2]?'active':''}" onclick="setPage('${n[2]}')"><span>${n[0]}</span>${n[1]}</button>`).join('')}</nav>`}
function head(eyebrow,title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div>${actions}</div>`:''}</div>`}
function stat(label,value,trend,icon){return `<div class="stat"><div class="spread"><span class="label">${label}</span><span>${icon||'✦'}</span></div><div class="value">${value}</div><div class="trend">${trend}</div></div>`}
function welcome(){return `<div class="login-screen"><section class="login-left"><div><div class="row"><div class="brand-mark">🏺</div><b>ArtisanConnect AI</b></div><h1>Good work<br>deserves a<br><span style="color:#d88a60">bigger market.</span></h1><p>A simple digital business manager built around artisans, their craft stories, fair opportunities and direct market access.</p><div class="row" style="flex-wrap:wrap"><span class="tag">✦ AI-assisted tools</span><span class="tag">◎ Product QR stories</span><span class="tag">🤝 Fair work allocation</span></div></div><div class="tiny" style="color:#cdb8a8">MADE FOR THE PEOPLE BEHIND THE CRAFT.</div></section><section class="login-right"><div class="login-box"><div class="eyebrow">WELCOME TO YOUR WORKSPACE</div><h2>Bring your craft online.</h2><p class="muted" style="font-size:13px;line-height:1.7;margin-bottom:25px">Enter the demo as an artisan, explore as a buyer, or open the admin overview for your presentation.</p><button class="btn primary" style="width:100%;padding:15px" onclick="demoLogin('artisan')">Continue as Artisan →</button><button class="btn outline" style="width:100%;padding:15px;margin-top:10px" onclick="demoLogin('buyer')">Explore as Buyer</button><button class="btn soft" style="width:100%;padding:15px;margin-top:10px" onclick="demoLogin('admin')">Open Admin Dashboard</button><div class="footer-note">Demo mode uses sample data stored in this browser. AI-generated text, pricing, allocation and photo enhancement are demonstrations—not verified AI outputs or guaranteed market prices.</div><div class="notice" style="margin-top:18px">Backend status: <b id="loginBackend">checking…</b><br>For a real multi-user app, run the included Node.js + SQLite backend.</div></div></section></div>`}
function demoLogin(role){state.role=role;state.user=role==='buyer'?{name:'Ananya Sharma'}:role==='admin'?{name:'Demo Admin'}:db.artisan;setPage(role==='buyer'?'market':role==='admin'?'admin':'dashboard');updateBackendLabel()}
function dashboard(){const published=db.products.filter(p=>p.status==='Published').length;const orders=db.orders.length;return `${head('ARTISAN WORKSPACE',`Good morning, ${esc(db.artisan.name.split(' ')[0])} 👋`,'Your craft is moving forward. Here is your business at a glance.',`<button class="btn primary" onclick="startAdd()">＋ Add product</button>`)}<section class="hero"><div><span class="tag">✦ YOUR AI BUSINESS COMPANION</span><h2>Turn your craft into<br>a stronger business.</h2><p>Create a professional catalog, discover fair pricing and tell the story behind every handmade product—all from one place.</p><button class="btn" style="background:#fff;color:#382319" onclick="startAdd()">Add Product with AI →</button></div><div class="hero-art">🪔</div></section><div class="grid stats">${stat('Total products',db.products.length,'Across your catalog','▧')}${stat('Active listings',published,'Visible to buyers','◎')}${stat('Orders to manage',orders,'Including bulk orders','▤')}${stat('Demo earnings',money(28400),'October sample data','₹')}</div><div class="grid two-col"><section class="panel"><div class="panel-head"><h3>Quick actions</h3><span class="tag">MADE SIMPLE</span></div><div class="grid quick-grid"><button class="quick" onclick="startAdd()"><span class="emoji">📸</span><strong>Add Product with AI</strong><small>Capture → describe → publish</small></button><button class="quick" onclick="setPage('catalog')"><span class="emoji">🧺</span><strong>My Catalog</strong><small>Manage products and QR stories</small></button><button class="quick" onclick="setPage('orders')"><span class="emoji">📦</span><strong>My Orders</strong><small>Track every order</small></button><button class="quick" onclick="setPage('bulk')"><span class="emoji">🤝</span><strong>Fair bulk work</strong><small>Share work across artisans</small></button><button class="quick" onclick="setPage('earnings')"><span class="emoji">📈</span><strong>Earnings</strong><small>Understand your sales</small></button><button class="quick" onclick="setPage('profile')"><span class="emoji">🪪</span><strong>My Profile</strong><small>Improve your quality score</small></button></div></section><section class="panel"><div class="panel-head"><h3>Profile quality</h3><span class="tag green">GOOD PROGRESS</span></div><div class="spread"><div><div style="font-size:42px;font-weight:900;letter-spacing:-2px">${db.artisan.score}<span class="muted" style="font-size:16px">/100</span></div><p class="tiny muted">AI-assisted profile score</p></div><div style="font-size:44px">🌟</div></div><div class="bar"><span style="width:${db.artisan.score}%"></span></div><div class="list-row"><span class="tiny">Profile completeness</span><b>95%</b></div><div class="list-row"><span class="tiny">Catalog quality</span><b>88%</b></div><div class="list-row"><span class="tiny">Order reliability</span><b>82%</b></div><button class="btn soft" style="width:100%;margin-top:12px" onclick="setPage('profile')">Improve my score →</button></section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><h3>Products getting attention</h3><button class="btn outline small" onclick="setPage('catalog')">View catalog</button></div><div class="grid product-grid">${db.products.filter(p=>p.status!=='Draft').slice(0,3).map(productCard).join('')}</div></section>`}
function productCard(p,market=false){return `<article class="product-card"><img class="product-img" src="${esc(p.img||imageFallback)}" alt="${esc(p.name)}" onerror="this.src='${imageFallback}'"><div class="product-body"><div class="spread"><span class="tag">${esc(p.craft)}</span><span class="tiny muted">${p.qty} available</span></div><h3>${esc(state.lang==='HI'?(p.hi||p.name):p.name)}</h3><div class="spread"><span class="price">${money(p.price)}</span><span class="tag ${p.status==='Published'?'green':p.status==='Sold Out'?'gray':'orange'}">${esc(p.status)}</span></div><div class="product-actions">${market?`<button class="btn primary small" onclick="viewProduct(${p.id})">View story</button><button class="btn outline small" onclick="addCart(${p.id})">Add to bag</button>`:`<button class="btn outline small" onclick="editProduct(${p.id})">Edit</button><button class="btn soft small" onclick="qrStory(${p.id})">QR story</button><button class="btn outline small" onclick="shareProduct(${p.id})">Share</button>`}</div></div></article>`}
function catalog(){return `${head('YOUR PRODUCTS','My catalog','Your craft, organized and ready to share.',`<button class="btn primary" onclick="startAdd()">＋ Add product</button>`)}<div class="market-tools"><input class="search" id="catalogSearch" placeholder="Search your products…" value="${esc(state.search)}" oninput="state.search=this.value;refreshProductGrid('catalogGrid')"><select class="search" style="max-width:190px" id="statusFilter" onchange="refreshProductGrid('catalogGrid')"><option value="All">All statuses</option><option>Published</option><option>Draft</option><option>Sold Out</option></select></div><div id="catalogGrid" class="grid product-grid">${catalogCards()}</div>`}
function catalogCards(){return db.products.filter(p=>(p.name.toLowerCase().includes(state.search.toLowerCase())||p.craft.toLowerCase().includes(state.search.toLowerCase()))&&(!$('#statusFilter')||$('#statusFilter').value==='All'||p.status===$('#statusFilter').value)).map(p=>productCard(p)).join('')||'<div class="empty"><div class="emoji">🧺</div><b>No products found</b><p>Try a different search or add a product.</p></div>'}
function refreshProductGrid(id){const el=$('#'+id);if(el)el.innerHTML=catalogCards()}
function startAdd(){state.photo='';state.enhanced=false;state.productDraft={name:'',material:'',size:'',color:'',craft:db.artisan.craft||'Pottery',time:'2 days',qty:10,cost:300,description:'',price:649};setPage('add')}
function addPage(){const d=state.productDraft;return `${head('CAPTURE → SPEAK → CREATE','Add product with AI','A guided flow. You do not need to write a professional catalog yourself.')}<div class="steps"><div class="step ${state.addStep===1?'active':''}">1 · Capture</div><div class="step ${state.addStep===2?'active':''}">2 · Enhance</div><div class="step ${state.addStep===3?'active':''}">3 · Describe</div><div class="step ${state.addStep===4?'active':''}">4 · Publish</div></div>${state.addStep===1?addStep1():state.addStep===2?addStep2():state.addStep===3?addStep3():addStep4()}`}
function addStep1(){return `<section class="panel"><div class="panel-head"><h3>1. Capture your product</h3><span class="tag">CAMERA / GALLERY</span></div><p class="muted tiny">Use a clear photo in natural light. Your product should remain the focus.</p><label class="photo-box" for="productFile">${state.photo?`<img src="${state.photo}" alt="Product preview">`:`<div><div style="font-size:48px">📷</div><b>Tap to take or upload a photo</b><p class="tiny muted">JPG, PNG or phone camera</p><span class="btn soft small">Choose photo</span></div>`}<input id="productFile" type="file" accept="image/*" capture="environment" onchange="handlePhoto(this.files[0])"></label><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px"><button class="btn outline" onclick="$('#productFile').removeAttribute('capture');$('#productFile').click()">📁 Upload from gallery</button><button class="btn primary" onclick="if(!state.photo){toast('Choose a photo first');return}state.addStep=2;render()">Continue →</button></div><div class="notice" style="margin-top:14px">Photo enhancement on this demo uses a visual CSS filter only. Real background removal needs an image-processing API or model.</div></section>`}
function handlePhoto(file){if(!file)return;if(!file.type.startsWith('image/')){toast('Please choose an image file');return}const r=new FileReader();r.onload=e=>{state.photo=e.target.result;state.enhanced=false;render()};r.readAsDataURL(file)}
function addStep2(){return `<section class="panel"><div class="panel-head"><h3>2. Photo preview</h3><span class="tag orange">DEMO SIMULATION</span></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div><div class="tiny muted" style="margin-bottom:7px">BEFORE · ORIGINAL</div><div class="photo-box" style="min-height:220px"><img src="${state.photo}"></div></div><div><div class="tiny muted" style="margin-bottom:7px">AFTER · PREVIEW</div><div class="photo-box" style="min-height:220px"><img src="${state.photo}" style="filter:brightness(1.12) contrast(1.08) saturate(1.08);transform:scale(1.02)"></div></div></div><p class="tiny muted" style="line-height:1.7;margin-top:14px">The “after” preview applies a browser filter. It does not truly remove backgrounds or use a trained AI model.</p><div class="grid" style="grid-template-columns:1fr 1fr 1fr;margin-top:15px"><button class="btn outline" onclick="state.addStep=1;render()">Retake</button><button class="btn soft" onclick="state.enhanced=false;state.addStep=3;render()">Use original</button><button class="btn primary" onclick="state.enhanced=true;state.addStep=3;render()">Use preview →</button></div></section>`}
function addStep3(){return `<section class="panel"><div class="panel-head"><h3>3. Tell us about your craft</h3><span class="tag">VOICE + TEXT</span></div><div class="notice">Voice input depends on browser support and internet access. AI catalog generation below uses a transparent demo template.</div><div style="margin-top:16px"><button class="btn dark" onclick="startVoice()" style="width:100%;padding:16px">🎙️ Describe your product by voice</button><p id="voiceStatus" class="tiny muted" style="margin-top:8px">Example: “Yeh handmade mitti ka diya hai. Isko banane mein do din lagte hain.”</p></div><div class="form-grid" style="margin-top:17px"><div class="field"><label>Product name</label><input id="dName" placeholder="e.g. Handcrafted clay diya" value="${esc(state.productDraft.name)}"></div><div class="field"><label>Craft category</label><select id="dCraft">${['Pottery','Handloom','Textiles','Painting','Woodcraft','Jewellery','Metal craft','Handmade Decor','Other Crafts'].map(x=>`<option ${state.productDraft.craft===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Material</label><input id="dMaterial" placeholder="Natural clay, cotton…" value="${esc(state.productDraft.material)}"></div><div class="field"><label>Size / dimensions</label><input id="dSize" placeholder="e.g. 10 cm" value="${esc(state.productDraft.size)}"></div><div class="field"><label>Color</label><input id="dColor" placeholder="e.g. Terracotta red" value="${esc(state.productDraft.color)}"></div><div class="field"><label>Time to make</label><input id="dTime" placeholder="e.g. 2 days" value="${esc(state.productDraft.time)}"></div><div class="field"><label>Quantity available</label><input id="dQty" type="number" min="0" value="${esc(state.productDraft.qty)}"></div><div class="field"><label>Raw material cost (₹)</label><input id="dCost" type="number" min="0" value="${esc(state.productDraft.cost)}"></div><div class="field full"><label>Describe it in your own words</label><textarea id="dDescription" placeholder="What makes this product special?">${esc(state.productDraft.description)}</textarea></div></div><div class="spread" style="margin-top:18px"><button class="btn outline" onclick="state.addStep=2;render()">← Back</button><button class="btn primary" onclick="makeCatalog()">Create catalog with AI →</button></div></section>`}
function startVoice(){const status=$('#voiceStatus');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Speech recognition is not supported in this browser. Type your description below instead.';toast('Voice input unavailable in this browser');return}const rec=new SR();rec.lang=state.lang==='HI'?'hi-IN':'en-IN';rec.interimResults=false;rec.onstart=()=>status.textContent='Listening… speak clearly';rec.onerror=()=>status.textContent='Could not capture voice. Please type your description.';rec.onresult=e=>{const text=e.results[0][0].transcript;$('#dDescription').value=text;status.textContent='Captured: “'+text+'”';if(!$('#dName').value){$('#dName').value=text.toLowerCase().includes('diya')?'Handcrafted Terracotta Diya':text.slice(0,48)}};rec.start()}
function makeCatalog(){const get=id=>$('#'+id)?.value?.trim()||'';state.productDraft={...state.productDraft,name:get('dName')||'Handcrafted Artisan Product',craft:get('dCraft'),material:get('dMaterial')||'Artisan-selected materials',size:get('dSize'),color:get('dColor'),time:get('dTime')||'Not specified',qty:Math.max(0,Number(get('dQty')||0)),cost:Math.max(0,Number(get('dCost')||0)),description:get('dDescription')};state.productDraft.price=Math.max(99,Math.round((state.productDraft.cost*1.7+250)/10)*10);state.productDraft.story=`Created by ${db.artisan.name}, a ${db.artisan.craft} artisan from ${db.artisan.location}. ${state.productDraft.description||'Each piece is made with care and reflects the skill and patience behind handmade craft.'} Making time: ${state.productDraft.time}.`;state.addStep=4;render()}
function addStep4(){const d=state.productDraft;const suggested=d.price||649;return `<section class="panel"><div class="panel-head"><h3>4. Review your catalog</h3><span class="tag orange">AI-STYLE DEMO</span></div><div class="grid two-col"><div><img src="${state.photo||imageFallback}" style="width:100%;height:260px;object-fit:cover;border-radius:16px;${state.enhanced?'filter:brightness(1.1) contrast(1.08)':''}"><div class="tiny muted" style="margin-top:7px">${state.enhanced?'Enhanced preview (CSS filter demo)':'Original image selected'}</div></div><div><span class="tag">${esc(d.craft)}</span><h2 style="font-size:23px;margin:12px 0 7px">${esc(d.name)}</h2><p class="muted" style="font-size:12px;line-height:1.8">${esc(d.description||`A thoughtfully handcrafted ${d.craft.toLowerCase()} piece made with ${d.material}. Each item reflects the artisan's skill and care.`)}</p><p class="tiny muted">Material: ${esc(d.material)} · Time: ${esc(d.time)} · Qty: ${d.qty}</p><div class="tag">Keywords: ${esc((d.name+' '+d.craft+' handmade').toLowerCase())}</div><p class="tiny muted">Hindi version: हिन्दी विवरण demo mode में बनाया जा सकता है; कृपया प्रकाशित करने से पहले जाँच लें।</p></div></div><div class="panel" style="background:#382319;color:white;margin-top:18px;border:0"><div class="eyebrow" style="color:#e7a17d">AI PRICING ASSISTANT · ESTIMATE ONLY</div><div class="spread" style="margin-top:8px"><div><div class="tiny" style="color:#ddc7b8">Suggested selling price</div><div style="font-size:35px;font-weight:900">${money(suggested)}</div></div><div style="text-align:right"><div class="tiny" style="color:#ddc7b8">Raw material cost</div><b>${money(d.cost)}</b></div></div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:14px"><div class="alloc-box"><small>Minimum estimate</small><b>${money(Math.round(suggested*.85))}</b></div><div class="alloc-box" style="background:#f3e6da"><small>Suggested</small><b>${money(suggested)}</b></div><div class="alloc-box"><small>Premium estimate</small><b>${money(Math.round(suggested*1.18))}</b></div></div><p class="tiny" style="color:#ddc7b8;line-height:1.7">Demo calculation uses entered cost plus a simple margin. It does not use live market trends and is not a guaranteed market price. Add labour, packaging, transport and taxes before deciding.</p><div class="spread"><button class="btn outline small" onclick="editSuggestedPrice()">Edit price</button><button class="btn" style="background:#fff;color:#382319" onclick="publishDraft()">Publish product + create QR story →</button></div></div><div class="spread" style="margin-top:15px"><button class="btn outline" onclick="state.addStep=3;render()">← Edit details</button><button class="btn soft" onclick="toast('Demo catalog regenerated from the current fields')">↻ Regenerate with AI (demo)</button></div></section>`}
function editSuggestedPrice(){const v=prompt('Enter your selling price in ₹',String(state.productDraft.price||649));if(v!==null&&Number(v)>0){state.productDraft.price=Number(v);render()}}
async function publishDraft(){const d=state.productDraft;const p={id:Date.now(),name:d.name,hi:d.name,price:d.price||649,cost:d.cost||0,qty:d.qty||0,craft:d.craft||'Other Crafts',img:state.photo||imageFallback,status:(d.qty||0)>0?'Published':'Sold Out',story:d.story||`Created by ${db.artisan.name} in ${db.artisan.location}.`,material:d.material,time:d.time,tags:`${d.craft}, handmade`,artisanId:db.artisan.id};db.products.unshift(p);persistLocal();const remote=await api('/products',{method:'POST',body:JSON.stringify(p)});toast(remote?'Published and saved to database':'Published in this browser demo');state.photo='';setPage('catalog')}
function orders(){return `${head('ORDER MANAGEMENT','My orders','Keep track of new requests, production and delivery.')}<div class="grid stats">${stat('All orders',db.orders.length,'Demo order book','▤')}${stat('New',db.orders.filter(o=>o.status==='New').length,'Needs attention','✦')}${stat('In production',db.orders.filter(o=>o.status==='In Production').length,'Work in progress','⚒')}${stat('Bulk orders',db.orders.filter(o=>o.bulk).length,'Shared work opportunity','🤝')}</div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Order</th><th>Buyer</th><th>Product / Qty</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td><b>${esc(o.id)}</b><div class="tiny muted">${esc(o.date)}</div></td><td>${esc(o.buyer)}</td><td>${esc(o.product)}<div class="tiny muted">Qty: ${o.qty}</div></td><td><b>${money(o.amount)}</b></td><td><span class="tag ${o.status==='Completed'?'green':o.status==='New'?'orange':'gray'}">${esc(o.status)}</span></td><td><button class="btn outline small" onclick="advanceOrder('${o.id}')">Update</button>${o.bulk?` <button class="btn soft small" onclick="setPage('bulk')">Allocation</button>`:''}</td></tr>`).join('')}</tbody></table></div></section>`}
function advanceOrder(id){const o=db.orders.find(x=>x.id===id);if(!o)return;const flow=['New','Accepted','In Production','Ready','Shipped','Completed','Allocated'];let idx=flow.indexOf(o.status);if(o.bulk){o.status=o.status==='Allocated'?'In Production':o.status==='In Production'?'Ready':'Allocated'}else{o.status=flow[Math.min(idx+1,5)]||'Completed'}persistLocal();toast(`${id} status: ${o.status}`);render()}
function bulk(){const o=db.orders.find(x=>x.bulk);return `${head('FAIR WORK DISTRIBUTION','Bulk order allocation','A large order can create paid opportunities for several eligible artisans.')}<section class="hero"><div><span class="tag">RULES-BASED DEMO</span><h2>One bulk order.<br>More artisans earning.</h2><p>Allocation is a transparent demonstration based on profile quality, reliability and stated capacity. It is not a trained machine-learning model.</p><button class="btn" style="background:white;color:#382319" onclick="runAllocation()">Run fair allocation demo →</button></div><div class="hero-art">🤝</div></section><div class="grid stats">${stat('Bulk order value',money(o.amount),'Buyer request','₹')}${stat('Quantity',o.qty+' pieces','Total requested','▦')}${stat('Artisans assigned',o.alloc.length,'Eligible demo artisans','♙')}${stat('Allocation status',o.status,'Rules-based demo','✓')}</div><section class="panel"><div class="panel-head"><h3>Bulk Order → Fair Allocation → Multiple Artisans</h3><span class="tag green">EXPLAINABLE DEMO</span></div><div class="allocation"><div class="alloc-box">🧾<b>Buyer order</b><small>${money(o.amount)} · ${o.qty} pieces</small></div><div class="allocation-arrow">→</div><div class="alloc-box">⚖️<b>Fair split</b><small>Score + reliability + capacity</small></div><div class="allocation-arrow">→</div><div class="alloc-box">🤝<b>${o.alloc.length} artisans</b><small>Work is shared</small></div></div><div id="allocationRows" style="margin-top:18px">${allocationRows(o)}</div><div class="notice" style="margin-top:16px">Fairness note: real allocation should consider skill match, consent, geographic feasibility, capacity, timely payment and auditability—not score alone. Demo amounts represent assigned work value, not confirmed payments.</div></section>`}
function allocationRows(o){return o.alloc.map(a=>`<div class="list-row"><div class="row"><img class="avatar" src="${esc(a.photo||seed.artisans.find(x=>x.name===a.name)?.photo||imageFallback)}"><div><b style="font-size:13px">${esc(a.name)}</b><div class="tiny muted">Profile score ${a.score}/100 · ${a.qty} pieces</div></div></div><div style="text-align:right"><b>${money(a.amount)}</b><div class="bar" style="width:120px;margin-top:7px"><span style="width:${Math.round(a.amount/o.amount*100)}%"></span></div></div></div>`).join('')}
function runAllocation(){const o=db.orders.find(x=>x.bulk);const eligible=db.artisans.filter(a=>a.capacity>0).sort((a,b)=>(b.score*.5+b.reliability*.3+Math.min(b.capacity,50)*.2)-(a.score*.5+a.reliability*.3+Math.min(a.capacity,50)*.2)).slice(0,3);let remaining=o.qty,totalScore=eligible.reduce((s,a)=>s+a.score,0);let rows=[];eligible.forEach((a,i)=>{let q=i===eligible.length-1?remaining:Math.min(a.capacity,Math.floor(o.qty*a.score/totalScore));remaining-=q;rows.push({name:a.name,qty:q,amount:Math.round(o.amount*q/o.qty),score:a.score,photo:a.photo})});if(remaining>0&&rows.length)rows[0].qty+=remaining;rows.forEach(r=>r.amount=Math.round(o.amount*r.qty/o.qty));o.alloc=rows;o.alloc[o.alloc.length-1].amount=o.amount-o.alloc.slice(0,-1).reduce((s,a)=>s+a.amount,0);persistLocal();render();toast('Demo allocation recalculated using profile score and capacity')}
function earnings(){const total=28400;return `${head('YOUR MONEY, CLEARLY','Earnings overview','Understand completed work, pending amounts and monthly movement.')}<div class="grid stats">${stat('Total demo earnings',money(102500),'Sample cumulative data','₹')}${stat('This month',money(total),'October sample data','↗')}${stat('Pending payments',money(8500),'Confirm with buyer','◷')}${stat('Completed orders','24','Sample count','✓')}</div><div class="grid two-col"><section class="panel"><div class="panel-head"><h3>Monthly earnings</h3><span class="tag">DEMO DATA</span></div><div style="height:220px;display:flex;align-items:end;gap:13px;padding:15px 4px 0">${db.earnings.map(m=>`<div style="flex:1;text-align:center;display:flex;flex-direction:column;justify-content:end;height:100%"><div class="tiny muted" style="margin-bottom:6px">${Math.round(m.value/1000)}k</div><div style="height:${m.value/300}px;background:linear-gradient(#d38b64,#a95432);border-radius:9px 9px 3px 3px;min-height:10px"></div><div class="tiny muted" style="margin-top:8px">${m.month}</div></div>`).join('')}</div><p class="tiny muted">Illustrative sample figures, not connected to a payment gateway.</p></section><section class="panel"><div class="panel-head"><h3>Recent earning sources</h3><span>₹</span></div><div class="list-row"><div><b style="font-size:12px">Terracotta Diya Set</b><div class="tiny muted">Retail order · 20 pieces</div></div><b>${money(12980)}</b></div><div class="list-row"><div><b style="font-size:12px">Bulk festive order</b><div class="tiny muted">Allocated work value</div></div><b>${money(5000)}</b></div><div class="list-row"><div><b style="font-size:12px">Phulkari Dupatta</b><div class="tiny muted">Direct buyer</div></div><b>${money(1299)}</b></div><div class="notice" style="margin-top:14px">Do not treat allocated bulk work as paid earnings until the order is completed and payment is confirmed.</div></section></div>`}
function profile(){const a=db.artisan;const factors=[['Profile completeness',95],['Catalog quality',88],['Customer feedback',84],['Order completion',82],['Product availability',76],['Response rate',86]];return `${head('YOUR CRAFT PROFILE','My artisan profile','Help buyers understand the maker behind the product.',`<button class="btn primary" onclick="editProfile()">Edit profile</button>`)}<div class="grid two-col"><section class="panel"><div class="row" style="align-items:flex-start"><img class="avatar" style="width:80px;height:80px" src="${esc(a.photo)}"><div><h2 style="margin:4px 0">${esc(a.name)}</h2><div class="muted" style="font-size:12px">${esc(a.craft)} · ${esc(a.location)}</div><div class="row" style="margin-top:10px;flex-wrap:wrap"><span class="tag green">✓ Demo verified profile</span><span class="tag">⭐ 4.8 sample rating</span></div></div></div><p style="font-size:13px;line-height:1.8;margin-top:20px">${esc(a.bio)}</p><div class="list-row"><span class="muted tiny">Experience</span><b>${a.experience} years</b></div><div class="list-row"><span class="muted tiny">Skills</span><b style="text-align:right">${esc(a.skills)}</b></div><div class="list-row"><span class="muted tiny">Materials</span><b>${esc(a.materials)}</b></div><div class="list-row"><span class="muted tiny">Published products</span><b>${db.products.filter(p=>p.status==='Published').length}</b></div></section><section class="panel"><div class="panel-head"><h3>Profile quality score</h3><span class="tag green">AI-ASSISTED DEMO</span></div><div style="font-size:50px;font-weight:900;letter-spacing:-3px">${a.score}<span class="muted" style="font-size:18px">/100</span></div><div class="bar"><span style="width:${a.score}%"></span></div><p class="tiny muted" style="line-height:1.7">Demo score based on sample factors. In a real service, publish the scoring formula and provide an appeal process so it does not unfairly exclude artisans.</p>${factors.map(([name,val])=>`<div style="margin-top:15px"><div class="spread tiny"><span>${name}</span><b>${val}%</b></div><div class="bar" style="margin-top:7px"><span style="width:${val}%"></span></div></div>`).join('')}<div class="notice" style="margin-top:17px">Suggestion: add product dimensions and clear photos to improve catalog completeness.</div></section></div>`}

function assistant(){return `${head('YOUR AI COMPANION','Ask your business assistant','Get simple next steps. Replies below are sample guidance, not live AI.')}<section class="panel" style="max-width:760px"><div class="row"><div class="brand-mark">✦</div><div><b>Artisan business helper</b><div class="tiny muted">Demo response engine · not a live AI model</div></div></div><div id="chatMessages" style="padding:16px 0"><div class="notice">Namaste ${esc(db.artisan.name.split(' ')[0])}! Ask me about pricing, catalog quality, product photos or which items are selling.</div></div><div class="grid quick-grid">${['How should I price my product?','Improve my product description','How can I improve product photos?','Which products are performing well?'].map(q=>`<button class="btn soft" onclick="askAssistant('${q}')">${q}</button>`).join('')}</div><div class="row" style="margin-top:16px"><input class="search" id="chatInput" placeholder="Type your question…" style="flex:1"><button class="btn primary" onclick="sendChat()">Send</button></div></section>`}
function askAssistant(q){const el=$('#chatMessages');if(!el)return;let answer='';if(q.toLowerCase().includes('price'))answer='Start with raw material + fair labour + packaging + transport + platform costs. Compare similar handmade products, then test a price that pays you fairly. The displayed demo price is only an estimate—not live market research.';else if(q.toLowerCase().includes('description'))answer='Mention the material, dimensions, making time, care instructions and what makes the craft distinctive. Keep claims factual; do not invent heritage, sustainability or certification details.';else if(q.toLowerCase().includes('photo'))answer='Use soft daylight, a plain background, one full-product image and one close-up. Keep colours true to life and show scale. The photo enhancer in this demo is only a CSS preview.';else answer='Your sample catalog has '+db.products.filter(p=>p.status==='Published').length+' published products. Review stock levels and order history before producing more. The performance numbers in this demo are illustrative.';el.innerHTML+=`<div style="margin:12px 0 12px auto;max-width:85%;background:#f4e6db;padding:12px;border-radius:14px;font-size:12px">${esc(q)}</div><div style="max-width:90%;background:#f7f5f1;padding:13px;border-radius:14px;font-size:12px;line-height:1.8">${esc(answer)}</div>`}
function sendChat(){const v=$('#chatInput')?.value.trim();if(v){askAssistant(v);$('#chatInput').value=''}}
function market(){const products=db.products.filter(p=>p.status==='Published'&&p.qty>0);return `${head('DISCOVER HANDMADE','Meet the makers','Shop thoughtful craft, discover its story, and support the people behind it.',`<button class="btn outline" onclick="setPage('cart')">🛒 Cart (${state.cart.reduce((s,x)=>s+x.qty,0)})</button>`)}<div class="hero"><div><span class="tag">CRAFT WITH A STORY</span><h2>Every handmade piece<br>has a person behind it.</h2><p>Discover pottery, textiles, woodcraft and more—directly from the artisans who make them.</p></div><div class="hero-art">🧵</div></div><div class="market-tools"><input class="search" id="marketSearch" placeholder="Search products or craft…" value="${esc(state.search)}" oninput="state.search=this.value;refreshMarket()"><select class="search" style="max-width:180px" id="marketCategory" onchange="state.category=this.value;refreshMarket()">${['All','Pottery','Handloom','Textiles','Painting','Woodcraft','Jewellery','Metal craft','Handmade Decor'].map(x=>`<option ${state.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="marketGrid" class="grid product-grid">${marketCards(products)}</div><section class="panel" style="margin-top:20px"><div class="panel-head"><h3>Meet the artisans</h3><span class="tag">PEOPLE FIRST</span></div><div class="grid quick-grid">${db.artisans.map(a=>`<div class="quick"><div class="row"><img class="avatar" src="${esc(a.photo)}"><div><b style="font-size:12px">${esc(a.name)}</b><div class="tiny muted">${esc(a.craft)} · ${esc(a.location)}</div></div></div><div class="spread" style="margin-top:12px"><span class="tag green">Quality ${a.score}/100</span><button class="btn outline small" onclick="showArtisan(${a.id})">Meet</button></div></div>`).join('')}</div></section>`}
function marketCards(products){return products.filter(p=>(state.category==='All'||p.craft===state.category)&&p.name.toLowerCase().includes(state.search.toLowerCase())).map(p=>productCard(p,true)).join('')||'<div class="empty"><div class="emoji">🔎</div><b>No matching craft found</b><p>Try another search or category.</p></div>'}
function refreshMarket(){const el=$('#marketGrid');if(el)el.innerHTML=marketCards(db.products.filter(p=>p.status==='Published'&&p.qty>0))}

function cart(){const items=state.cart.map(x=>({...x,product:db.products.find(p=>p.id===x.id)})).filter(x=>x.product);const total=items.reduce((s,x)=>s+x.product.price*x.qty,0);return `${head('YOUR BAG','Shopping bag','A small collection of handmade goods.',`<button class="btn outline" onclick="setPage('market')">Continue discovering</button>`)}${items.length?`<section class="panel">${items.map(x=>`<div class="list-row"><div class="row"><img src="${esc(x.product.img)}" style="width:65px;height:65px;object-fit:cover;border-radius:12px"><div><b>${esc(x.product.name)}</b><div class="tiny muted">${money(x.product.price)} each</div><div class="row" style="margin-top:7px"><button class="btn outline small" onclick="changeCart(${x.id},-1)">−</button><span>${x.qty}</span><button class="btn outline small" onclick="changeCart(${x.id},1)">+</button></div></div></div><b>${money(x.product.price*x.qty)}</b></div>`).join('')}<div class="spread" style="margin-top:18px"><b>Demo total</b><b class="price">${money(total)}</b></div><p class="tiny muted">No real payment will be collected in this prototype.</p><button class="btn primary" style="width:100%" onclick="checkoutDemo()">Place demo order</button></section>`:'<section class="panel empty"><div class="emoji">🛍️</div><h3>Your bag is empty</h3><p>Discover handmade pieces from artisans.</p><button class="btn primary" onclick="setPage(\'market\')">Explore marketplace</button></section>'}`}
function changeCart(id,delta){const x=state.cart.find(x=>x.id===id);if(x)x.qty+=delta;state.cart=state.cart.filter(x=>x.qty>0);render()}
function checkoutDemo(){if(!state.cart.length)return;const total=state.cart.reduce((s,x)=>{const p=db.products.find(p=>p.id===x.id);return s+(p?p.price*x.qty:0)},0);const o={id:'ORD-'+Date.now().toString().slice(-6),buyer:state.user?.name||'Demo Buyer',product:state.cart.map(x=>db.products.find(p=>p.id===x.id)?.name).join(', '),qty:state.cart.reduce((s,x)=>s+x.qty,0),amount:total,status:'New',date:'Just now'};db.orders.unshift(o);state.cart.forEach(x=>{const p=db.products.find(p=>p.id===x.id);if(p)p.qty=Math.max(0,p.qty-x.qty)});state.cart=[];persistLocal();api('/orders',{method:'POST',body:JSON.stringify(o)});modal(`<div style="text-align:center"><div style="font-size:48px">✓</div><h2>Demo order placed</h2><p class="muted" style="line-height:1.8">Order ${esc(o.id)} has been created in the demo. No payment was processed.</p><button class="btn primary" style="width:100%" onclick="closeModal();setPage('buyerOrders')">View my orders</button></div>`)}

function qrStory(id){const p=db.products.find(x=>x.id===id);if(!p)return;const a=db.artisans.find(x=>x.id===p.artisanId)||db.artisans[0];const url=`${location.origin}${location.pathname}#story-${p.id}`;modal(`<div class="spread"><div><div class="eyebrow">A STORY BEHIND THE CRAFT</div><h2 style="margin-top:8px">${esc(p.name)}</h2></div><button class="btn outline small" onclick="closeModal()">✕</button></div><div class="row" style="align-items:flex-start;margin-top:14px"><img src="${esc(p.img)}" style="width:110px;height:110px;object-fit:cover;border-radius:14px"><div><b>${esc(a.name)}</b><div class="tiny muted">${esc(a.craft)} · ${esc(a.location)}</div><p class="tiny" style="line-height:1.7">${esc(p.story)}</p></div></div><div id="qrCanvas" class="qr-wrap" style="margin-top:16px"><div style="text-align:center"><div style="font-size:35px">◎</div><div class="tiny muted">Creating QR code…</div></div></div><p class="tiny muted" style="line-height:1.7">Scan the QR or open the story link in this demo. Story details are based on artisan-provided/sample information, not independently verified claims.</p><div class="field"><label>Story link</label><input id="storyUrl" readonly value="${esc(url)}"></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px"><button class="btn outline" onclick="GenCopyStory()">Copy link</button><button class="btn primary" onclick="closeModal();setPage('story');state.selectedProduct=${p.id};render()">Open story page</button></div>`);setTimeout(()=>{const el=$('#qrCanvas');if(!el)return;el.innerHTML='';if(window.QRCode){new QRCode(el,{text:url,width:180,height:180,colorDark:'#2f211a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}else{el.innerHTML='<p class="tiny muted">QR library not loaded. Use the story link above.</p>'}},100)}
function GenCopyStory(){const v=$('#storyUrl')?.value||'';if(navigator.clipboard&&location.protocol!=='file:')navigator.clipboard.writeText(v).then(()=>toast('Story link copied')).catch(()=>prompt('Copy story link',v));else prompt('Copy story link',v)}
function storyPage(){const p=db.products.find(x=>x.id===state.selectedProduct)||db.products[0];const a=db.artisans.find(x=>x.id===p.artisanId)||db.artisans[0];return `${head('THE MAKER BEHIND THE PIECE','Every craft has a story','A product story created from artisan-provided details.',`<button class="btn outline" onclick="setPage('market')">← Back to marketplace</button>`)}<section class="story-hero"><img src="${esc(p.img)}"><div class="story-copy"><span class="tag">HANDMADE · ${esc(p.craft.toUpperCase())}</span><h2 style="font-size:28px;margin:14px 0 5px">${esc(p.name)}</h2><div class="row"><img class="avatar" src="${esc(a.photo)}"><div><b>${esc(a.name)}</b><div class="tiny" style="color:#e2cbb9">${esc(a.location)}</div></div></div><p>${esc(p.story)}</p><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:9px"><div class="alloc-box"><small>Craft</small><b>${esc(p.craft)}</b></div><div class="alloc-box"><small>Making time</small><b>${esc(p.time||'Not stated')}</b></div><div class="alloc-box"><small>Material</small><b>${esc(p.material||'As described')}</b></div></div><button class="btn" style="margin-top:18px;background:#fff;color:#382319" onclick="setPage('product');state.selectedProduct=${p.id};render()">Support this artisan · ${money(p.price)}</button></div></section><p class="tiny muted" style="margin-top:12px">Transparency: the story is a demo based on supplied/sample information. Do not treat it as independently verified provenance.</p>`}
function editProduct(id){const p=db.products.find(x=>x.id===id);if(!p)return;modal(`<h2>Edit product</h2><div class="form-grid"><div class="field full"><label>Product name</label><input id="eName" value="${esc(p.name)}"></div><div class="field"><label>Price (₹)</label><input id="ePrice" type="number" value="${p.price}"></div><div class="field"><label>Quantity</label><input id="eQty" type="number" value="${p.qty}"></div><div class="field"><label>Category</label><input id="eCraft" value="${esc(p.craft)}"></div><div class="field"><label>Status</label><select id="eStatus">${['Draft','Published','Sold Out'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>Product story</label><textarea id="eStory">${esc(p.story)}</textarea></div></div><div class="spread" style="margin-top:18px"><button class="btn danger" onclick="deleteProduct(${id})">Delete</button><button class="btn outline" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProduct(${id})">Save changes</button></div>`)}
function saveProduct(id){const p=db.products.find(x=>x.id===id);if(!p)return;p.name=$('#eName').value.trim()||p.name;p.price=Math.max(0,Number($('#ePrice').value)||0);p.qty=Math.max(0,Number($('#eQty').value)||0);p.craft=$('#eCraft').value.trim()||p.craft;p.status=$('#eStatus').value;if(p.qty===0&&p.status==='Published')p.status='Sold Out';p.story=$('#eStory').value;persistLocal();api('/products/'+id,{method:'PUT',body:JSON.stringify(p)});closeModal();render();toast('Product updated')}
function deleteProduct(id){if(!confirm('Delete this demo product?'))return;db.products=db.products.filter(p=>p.id!==id);persistLocal();api('/products/'+id,{method:'DELETE'});closeModal();render();toast('Product deleted')}
function shareProduct(id){const p=db.products.find(x=>x.id===id);if(!p)return;const text=`${p.name} — ${money(p.price)}\n${p.story}\n${location.origin}${location.pathname}#story-${p.id}`;if(navigator.share)navigator.share({title:p.name,text}).catch(()=>{});else if(navigator.clipboard&&location.protocol!=='file:')navigator.clipboard.writeText(text).then(()=>toast('Product story copied')).catch(()=>prompt('Copy product details',text));else prompt('Copy product details',text)}
function buyerBulk(){modal(`<h2>Request a bulk order</h2><p class="muted tiny">Demo request form; it does not contact real artisans.</p><div class="form-grid"><div class="field full"><label>Product / craft needed</label><input id="bulkProduct" placeholder="e.g. 500 terracotta diyas"></div><div class="field"><label>Quantity</label><input id="bulkQty" type="number" min="1" value="100"></div><div class="field"><label>Budget (₹)</label><input id="bulkBudget" type="number" value="50000"></div><div class="field full"><label>Delivery location</label><input id="bulkLoc" placeholder="City / PIN code"></div></div><button class="btn primary" style="width:100%;margin-top:17px" onclick="submitBulk()">Create demo bulk request</button>`)}
function submitBulk(){const qty=Math.max(1,Number($('#bulkQty').value)||1),amount=Math.max(0,Number($('#bulkBudget').value)||0);const o={id:'BULK-'+Date.now().toString().slice(-5),buyer:state.user?.name||'Demo Buyer',product:$('#bulkProduct').value||'Custom craft bulk order',qty,amount,status:'New request',date:'Just now',bulk:true,alloc:[]};db.orders.unshift(o);persistLocal();api('/bulk-orders',{method:'POST',body:JSON.stringify(o)});closeModal();toast('Demo bulk request created');setPage('buyerOrders')}
function buyNow(id){addCart(id);setPage('cart')}
function modal(content){$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function render(){updateBackendLabel();const root=$('#root');if(state.page==='welcome'){root.innerHTML=welcome();$('#logoutBtn').classList.add('hidden');$('#loginBackend').textContent=state.backend==='connected'?'Connected to SQLite backend':'Demo mode (backend not connected)';return}$('#logoutBtn').classList.remove('hidden');let content='';switch(state.page){case'dashboard':content=dashboard();break;case'add':content=addPage();break;case'catalog':content=catalog();break;case'orders':content=orders();break;case'bulk':content=bulk();break;case'earnings':content=earnings();break;case'profile':content=profile();break;case'assistant':content=assistant();break;case'market':content=market();break;case'product':content=productPage();break;case'cart':content=cart();break;case'buyerOrders':content=buyerOrders();break;case'saved':content=saved();break;case'buyerProfile':content=buyerProfile();break;case'admin':content=admin();break;case'adminArtisans':content=adminArtisans();break;case'story':content=storyPage();break;default:content=dashboard()}root.innerHTML=state.role==='admin'?`<div class="layout"><aside class="sidebar"><div class="side-label">ADMIN</div>${navItem('▦','Overview','admin')}${navItem('♙','Artisans','adminArtisans')}${navItem('◇','Products','catalog')}${navItem('▤','Orders','orders')}${navItem('⌕','Marketplace','market')}</aside><main class="content">${content}</main></div>`:shell(content);if(state.page==='catalog')refreshProductGrid('catalogGrid');if(state.page==='market')refreshMarket()}
$('#langToggle').onclick=()=>{state.lang=state.lang==='EN'?'HI':'EN';toast(state.lang==='HI'?'Hindi mode selected (core labels are demo-ready)':'English selected');render()};
$('#logoutBtn').onclick=()=>{state.user=null;state.role='artisan';state.page='welcome';render()};
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#story-(\d+)/);if(m){state.selectedProduct=Number(m[1]);state.page='story';render()}});
window.addEventListener('storage',()=>{loadLocal();render()});
state.addStep=1;checkBackend().then(()=>render());
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</body>
</html>
